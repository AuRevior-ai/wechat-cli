[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-cli"
# Stable runtime SemVer and Python distribution version are identical.
version = "0.6.1"
description = "WeChat data query CLI for LLMs"
authors = [{ name = "Au Revior" }]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "pycryptodome>=3.19,<4",
    "zstandard>=0.22,<1",
    "pywebview==6.2.1",
]

[project.scripts]
wechat-cli = "wechat_cli.main:cli"
wechat-cli-launcher = "wechat_cli.launcher.cli:cli"
wechat-cli-admin = "wechat_cli.admin.cli:cli"
wechat-cli-release = "wechat_cli.release.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
wechat_cli = ["bin/*", "web/static/*", "launcher/ui/*"]
